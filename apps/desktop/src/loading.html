<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
    <title>CrewCode</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: hsl(228, 40%, 11%);
        color: #e7ebf5;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .mark {
        width: 64px; height: 64px; border-radius: 18px;
        background: hsl(46, 92%, 62%); color: hsl(228, 40%, 11%);
        display: grid; place-items: center; font-weight: 900; font-size: 34px;
        border: 3px solid #0b0e18;
      }
      .name { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
      .sub { color: #9aa6c0; font-size: 13px; }
      .bar { width: 220px; height: 6px; border-radius: 99px; background: #1c2438; overflow: hidden; }
      .bar > i { display: block; width: 40%; height: 100%; border-radius: 99px; background: hsl(46, 92%, 62%); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div class="mark">C</div>
    <div class="name">CrewCode</div>
    <div class="sub">Starting your workspace…</div>
    <div class="bar"><i></i></div>
    <div class="sub" id="hint">first run can take a moment</div>
    <script>
      setTimeout(function () {
        document.getElementById("hint").textContent = "still starting — checking database and helpers";
      }, 8000);
    </script>
  </body>
</html>
